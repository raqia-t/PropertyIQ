services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: propertyiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: propertyiq_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propertyiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: propertyiq-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: propertyiq-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=propertyiq_db;Username=postgres;Password=postgrespassword
      - Jwt__Secret=PropertyIQ_Super_Secret_Key_For_Pakistan_RealEstate_Platform_2026_With_Sufficient_Entropy_For_HmacSha256
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: propertyiq-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - api

volumes:
  pgdata:
